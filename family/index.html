<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sound Check · practice at home</title>
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Sound Check">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2ECE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../speechgames.css">
<style>
:root{--bg:#F2ECE0;--surface:#FBF7EE;--ink:#2A2420;--muted:#6E645B;--line:#DCD2C2;--chip:#EDE5D6;--accent:#A24B4B;--warn:#94661C;--warn-soft:#F3E4C6;--good:#3F7356;--good-soft:#DDE8DA;--bad-soft:#F2D9D3;--blue:#2F7DE1;--yellow:#F2C230;--red:#E0453A}
@media (prefers-color-scheme:dark){:root{--bg:#1C1916;--surface:#25211D;--ink:#EDE4D6;--muted:#A99D8F;--line:#3B342D;--chip:#2F2A25;--accent:#DB8A7C;--warn:#D9AE5F;--warn-soft:#3A3020;--good:#8DBF9C;--good-soft:#23352B;--bad-soft:#3E2521}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top svg{width:46px;height:46px;border-radius:12px;flex:none}
.top h1{margin:0;font:400 1.7rem/1 "Libre Caslon Display",Georgia,serif}
.top h1 small{display:block;font:italic .82rem "Libre Caslon Text",Georgia,serif;color:var(--muted);margin-top:3px}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.btn.ink{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.star{font-weight:700;font-size:.95rem}
.pick{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (min-width:761px){.chips{flex-wrap:wrap;overflow:visible}}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:.92rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips button:disabled{opacity:.35;cursor:default}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}.tip{order:2}}
.tip{background:var(--warn-soft);border-radius:18px;padding:14px 16px;font-size:.95rem}
.tip h2{margin:0 0 6px;font:700 1rem "Libre Caslon Text",Georgia,serif;color:var(--warn)}
.tip p{margin:0 0 8px}.tip p:last-child{margin:0}
.tip .try{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.tip .try span{background:var(--surface);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.88rem}
.tip .src{font-size:.72rem;color:var(--muted);font-style:italic}
.card{background:var(--surface);border-radius:24px;padding:18px;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.06);position:relative}
.card .n{position:absolute;top:14px;left:18px;color:var(--muted);font-weight:700;font-size:.85rem}
.card .hw{position:absolute;top:10px;right:12px;font-size:.78rem;padding:4px 10px}
.pic{font-size:min(30vw,150px);line-height:1.1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;min-height:1.1em}
.word{font-size:min(10vw,2.6rem);font-weight:800;letter-spacing:.01em;min-height:1.2em}
.hidew .word{filter:blur(10px)}
.stamps{display:flex;gap:6px;justify-content:center;margin:12px 0 14px;flex-wrap:wrap}
.stamps i{width:24px;height:24px;border-radius:50%;border:2px dashed var(--line)}
.stamps i.b{background:var(--blue);border:0}.stamps i.y{background:var(--yellow);border:0}.stamps i.r{background:var(--red);border:0}
.stamps i.now{outline:2px solid var(--ink);outline-offset:2px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:2px solid transparent;border-radius:16px;padding:14px 4px;font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.rate button i{width:20px;height:20px;border-radius:50%}
.rate .r{background:var(--bad-soft)}.rate .r i{background:var(--red)}
.rate .y{background:var(--warn-soft)}.rate .y i{background:var(--yellow)}
.rate .b{background:#DCE6F7}.rate .b i{background:var(--blue)}
@media (prefers-color-scheme:dark){.rate .b{background:#1E2A3D}}
.rate button:active{transform:scale(.97)}
.fin{padding:10px 0}
.fin h2{margin:4px 0;font:400 1.8rem "Libre Caslon Display",Georgia,serif}
.wall{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:360px;margin:12px auto}
.wall i{aspect-ratio:1;border-radius:50%}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:14px;font-size:.85rem;color:var(--muted)}
.foot .row{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px}
.panel h3{margin:0 0 8px;font:700 1rem "Libre Caslon Text",Georgia,serif}
.panel label{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.panel input{width:100%;max-width:280px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.panel .hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;z-index:99}
.hop{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes hop{35%{transform:translateY(-14px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.hop{animation:none}}
.hwban{display:flex;gap:14px;align-items:center;background:#E6EFE8;color:#2F5540;border-radius:22px;padding:14px 18px;margin:0 0 14px}.hwban span{font-size:2rem}.hwban b{display:block;font-size:1.15rem}.hwban small{opacity:.8}
.vs{color:#9A9087;font-weight:700;font-size:1.05rem;margin-top:-4px}
</style>
</head>

const ICON=`<svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" fill="#F2ECE0"/><circle cx="512" cy="470" r="330" fill="#C9D6E4" opacity=".85"/><g stroke="#2A2420" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M340 860 C285 860 268 745 286 635 C306 505 395 395 512 395 C629 395 718 505 738 635 C756 745 739 860 684 860 C645 860 612 834 512 834 C412 834 379 860 340 860 Z" fill="#E7A3A6"/><path d="M392 585 c26 -15 58 -15 84 0 M548 568 c28 -20 66 -20 94 -6" fill="none"/><circle cx="434" cy="632" r="14" fill="#2A2420"/><circle cx="596" cy="632" r="14" fill="#2A2420"/><path d="M470 722 c28 9 62 9 90 -2" fill="none"/><path d="M780 250 q40 40 0 80 M830 210 q80 80 0 160" fill="none" stroke="#A24B4B" stroke-width="20"/><path d="M196 300 q-40 40 0 80 M146 260 q-80 80 0 160" fill="none" stroke="#A24B4B" stroke-width="20"/></g></svg>`;
const POS={i:'Start of word',m:'Middle',f:'End of word'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isCl=k=>k.length===2&&k[0]==='c'&&!['ch'].includes(k);
const fl=k=>{if(isCl(k)){const s=(D.sounds.find(x=>x[0]===k)||[])[1]||k;return s.replace('clusters','blends')}return k};
/* ---------- saved state (this device only) ---------- */
let ST={name:'',log:[],games:{},hide:false};
try{Object.assign(ST,JSON.parse(localStorage.getItem('sc-family')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('sc-family',JSON.stringify(ST))}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
/* ---------- view state ---------- */
const V={k:null,p:'i',deck:[],i:0,res:[],fin:false,pop:-1,share:false,vs:{}};
const HW='_hw';
function readHW(raw){try{const b=raw.replace(/-/g,'+').replace(/_/g,'/');const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
  if(!o||!Array.isArray(o.w)||!o.w.length)return false;const t=String(o.t||'Homework').slice(0,60);const ws=[];V.vs={};
  o.w.slice(0,40).forEach(x=>{const w=String(x[0]||'').slice(0,40);if(!w)return;ws.push(w);if(x[1])D.pics[w]=String(x[1]).slice(0,16);if(x[2])V.vs[w]=String(x[2]).slice(0,40)});
  if(!ws.length)return false;D.words[HW]={[t]:ws};if(o.k&&D.tips[o.k])D.tips[HW]=D.tips[o.k];else delete D.tips[HW];
  V.k=HW;V.p=t;if(o.n){ST.name=String(o.n).slice(0,20);save()}return true}catch(e){return false}}
function readHash(){if(location.hash.startsWith('#h=')){if(readHW(location.hash.slice(3)))return}
  const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^([a-z]+)(?:-([imf]))?(?:&n=(.*))?$/);
  if(m&&D.words[m[1]]){V.k=m[1];V.p=m[2]||'i';if(m[3]&&!ST.name){ST.name=m[3].slice(0,20);save()}}}
function setHash(){if(V.k===HW)return;history.replaceState(null,'','#'+V.k+(isCl(V.k)?'':'-'+V.p))}
function okPos(k){const o=D.words[k]||{};if(k===HW)return Object.keys(o);return ['i','m','f'].filter(p=>(o[p]||[]).length>=4)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newDeck(){const ws=(D.words[V.k]||{})[V.p]||[];V.deck=shuffle(ws).slice(0,10);V.i=0;V.res=[];V.fin=false;V.pop=-1}
function pick(k,p){if(k!==HW&&location.hash.startsWith('#h='))history.replaceState(null,'','#');V.k=k;const ok=okPos(k);V.p=ok.includes(p)?p:ok[0];newDeck();setHash();render()}
/* ---------- stars ---------- */
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d}
function weekStamps(){const ws=weekStart();return ST.log.filter(x=>new Date(x.d+'T12:00')>=ws&&x.r!=='r').length}
/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  const groups=[...new Set(D.sounds.map(s=>s[2]))];
  const tip=D.tips[V.k];
  const ipa=(D.sounds.find(s=>s[0]===V.k)||[])[1];
  let h=`<div class="top">${ICON}<h1>Sound Check<small>practice at home${ST.name?' · '+esc(ST.name):''}</small></h1>
   <div class="sp"><span class="star">⭐ ${weekStamps()} this week</span>${V.k?`<button class="btn" data-a="games">🎮 Games</button>`:''}<button class="btn ink" data-a="share">📤 Send to my speechie</button></div></div>`;
  if(V.k===HW)h+=`<div class="hwban"><span>🏠</span><div><b>${ST.name?esc(ST.name)+'’s homework':'This week’s homework'}</b><small>${esc(V.p)} · ${(D.words[HW][V.p]||[]).length} words from your speech pathologist</small></div></div>`;
  else h+=`<div class="pick"><div class="chips" role="group" aria-label="Sound">${D.sounds.map(([k,ip])=>`<button data-a="snd" data-k="${k}" aria-pressed="${k===V.k}">${esc(fl(k))}</button>`).join('')}</div>`;

  if(V.k!==HW)h+=`</div>`;
  if(!V.k){h+=`<div class="card" style="padding:40px 20px"><div class="pic">👆</div><p style="font-size:1.15rem;margin:8px 0 0">Pick the sound your speech pathologist is working on.</p></div>`}

    h+=`<div class="card ${ST.hide?'hidew':''}">`;
    if(V.fin){const cnt=k=>V.res.filter(x=>x===k).length;
      h+=`<div class="fin"><div class="pic" style="font-size:90px">🏆</div><h2>${V.res.length} words done!</h2><div class="wall">${V.res.map(r=>`<i style="background:var(--${r==='b'?'blue':r==='y'?'yellow':'red'})"></i>`).join('')}</div>
        <p>${cnt('b')} super clear · ${cnt('y')} quite clear · ${cnt('r')} try again</p><button class="btn ink" data-a="again">Practise again</button></div>`}
    else{const w=V.deck[V.i];
      h+=`<span class="n">${V.i+1} of ${V.deck.length}</span><button class="btn hw" data-a="hide">${ST.hide?'Show word':'Hide word'}</button>
       <div class="pic ${V.pop===V.i-1?'hop':''}">${esc(D.pics[w]||'')}</div><div class="word">${esc(w)}</div>${V.k===HW&&V.vs[w]?`<div class="vs">not “${esc(V.vs[w])}”</div>`:''}
       <div class="stamps">${V.deck.map((_,j)=>`<i class="${V.res[j]||''} ${j===V.i?'now':''}"></i>`).join('')}</div>
       <div class="rate"><button class="r" data-a="rate" data-v="r"><i></i>Let’s try again</button><button class="y" data-a="rate" data-v="y"><i></i>Quite clear</button><button class="b" data-a="rate" data-v="b"><i></i>Super clear</button></div>`}
    h+=`</div></div>`;
  }
  h+=`<div class="foot"><span>Practice stays on this device until you send it.</span><div class="row"><button class="btn" data-a="setup">${V.share?'Close':'⚙︎ For speech pathologists'}</button></div></div>`;
  if(V.share){h+=`<div class="panel"><h3>Set up a link for a family</h3>
    <label for="nm">Child's first name or initials (optional)</label><input id="nm" maxlength="20" value="${esc(ST.name)}" placeholder="e.g. Sam or S.T.">
    <p class="hint">Pick the sound and word position above, then copy the link. It opens straight onto that practice. Results come back when the family taps “Send to my speechie”.</p>
    <div style="margin-top:10px"><button class="btn ink" data-a="copy" ${V.k&&V.k!==HW?'':'disabled'}>📋 Copy link for family</button></div></div>`}
  app.innerHTML=h;
}
/* ---------- results summary ---------- */
function summary(){
  const since=new Date();since.setDate(since.getDate()-13);const s0=since.toISOString().slice(0,10);
  const L=ST.log.filter(x=>x.d>=s0);
  if(!L.length)return null;
  const days=[...new Set(L.map(x=>x.d))].sort();
  const by={};L.forEach(x=>{const key=x.k+'|'+x.p;(by[key]=by[key]||[]).push(x)});
  const fmt=d=>new Date(d+'T12:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  let t=`Sound Check home practice${ST.name?' – '+ST.name:''}\n${fmt(days[0])} to ${fmt(days[days.length-1])}: practised on ${days.length} day${days.length>1?'s':''} (${days.map(fmt).join(', ')})\n`;
  Object.entries(by).forEach(([key,arr])=>{const [k,p]=key.split('|');const ip=(D.sounds.find(s=>s[0]===k)||[])[1];
    const c=r=>arr.filter(x=>x.r===r).length;
    const tricky={};arr.filter(x=>x.r==='r').forEach(x=>tricky[x.w]=(tricky[x.w]||0)+1);
    const tk=Object.entries(tricky).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w])=>w);
    t+=`\n${k===HW?'Homework ('+p+')':(isCl(k)?fl(k):'"'+fl(k)+'" sound')+(isCl(k)?'':', '+POS[p].toLowerCase())}: ${arr.length} words\n  Super clear ${c('b')} · Quite clear ${c('y')} · Try again ${c('r')}`+(tk.length?`\n  Tricky words: ${tk.join(', ')}`:'')+'\n'});
  return t;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
async function share(){
  const t=summary();if(!t){toast('No practice yet in the last 2 weeks.');return}
  if(navigator.share){try{await navigator.share({title:'Home practice',text:t});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into a text or email to your speechie.')}catch(e){location.href='mailto:?subject='+encodeURIComponent('Home practice')+'&body='+encodeURIComponent(t)}
}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||b.closest('.sgk'))return;const a=b.dataset.a;
  if(a==='snd')pick(b.dataset.k,V.p);
  if(a==='pos'){V.p=b.dataset.p;newDeck();setHash();render()}
  if(a==='rate'){const w=V.deck[V.i];const v=b.dataset.v;V.res[V.i]=v;ST.log.push({d:today(),k:V.k,p:V.p,w,r:v});if(ST.log.length>3000)ST.log=ST.log.slice(-3000);save();V.pop=V.i;V.i++;if(V.i>=V.deck.length)V.fin=true;render()}
  if(a==='again'){newDeck();render()}
  if(a==='hide'){ST.hide=!ST.hide;save();render()}
  if(a==='share')share();
  if(a==='setup'){V.share=!V.share;render()}
  if(a==='copy'){const n=(document.getElementById('nm')?.value||'').trim().slice(0,20);ST.name=n;save();
    const url=location.origin+location.pathname+'#'+V.k+'-'+V.p+(n?'&n='+encodeURIComponent(n):'');
    try{await navigator.clipboard.writeText(url);toast('Link copied')}catch(e){prompt('Copy this link:',url)}render()}
  if(a==='games'){if(!window.SpeechGames){toast('Games are still loading.');return}
    const ws=(D.words[V.k]||{})[V.p]||[];const ip=(D.sounds.find(s=>s[0]===V.k)||[])[1];
    SpeechGames.open({items:ws.map(w=>({key:w,text:w})),pic:w=>D.pics[w]||'',who:ST.name.split(' ')[0],title:V.k===HW?V.p:(isCl(V.k)?fl(V.k):'"'+fl(V.k)+'" words'),state:ST.games||{},
      onSave:st=>{ST.games=st;save()},
      onFinish:res=>{(res||[]).forEach(r=>ST.log.push({d:today(),k:V.k,p:V.p,w:r.key,r:r.k==='clear'?'b':r.k==='near'?'y':'r'}));save();render()}})}
});
document.addEventListener('keydown',e=>{if(document.querySelector('.sgk')||!V.k||V.fin||e.target.tagName==='INPUT')return;const m={ArrowRight:'b',ArrowDown:'y',ArrowLeft:'r'}[e.key];if(m)document.querySelector(`.rate [data-v="${m}"]`)?.click()});
window.addEventListener('hashchange',()=>{readHash();if(V.k){const ok=okPos(V.k);if(!ok.includes(V.p))V.p=ok[0];newDeck()}render()});
readHash();if(V.k){const ok=okPos(V.k);if(!ok.includes(V.p))V.p=ok[0];newDeck()}
render();
</script>
