var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,

/* Layout: caseload rail on the left, working area on the right; collapses to one column with a client picker on phones. */
:root{

  --r:4px; --wash-op:.75;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.ipa{font-family:var(--f-ipa);font-weight:500}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.45rem;font-weight:400;letter-spacing:-.005em}
h2{font-size:1.45rem;font-weight:400}
h3{font-family:var(--f-serif);font-size:1.05rem;font-weight:700}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .mark{width:40px;height:40px;display:block;flex:0 0 auto;transition:transform .3s}.top .mark svg{display:block}.homebtn:hover .mark{transform:rotate(-8deg)}
.top h1{font-family:"Libre Caslon Display","Libre Caslon Text",Georgia,serif;font-weight:400;font-size:1.6rem;letter-spacing:-.005em;display:flex;flex-direction:column;line-height:1.05}
.top h1 small{font-family:"Libre Caslon Text",Georgia,serif;font-style:italic;font-size:.78rem;letter-spacing:.01em;color:var(--muted);margin-top:2px}
.top .grow{flex:1}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.rail .client{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer}
.rail .client:hover{background:var(--chip)}
.rail .client[aria-current="true"]{background:var(--surface);border-color:var(--line);font-weight:700}
.rail .client small{color:var(--muted);font-weight:400}
.rail .sep{height:1px;background:var(--line);margin:8px 0}
.mobile-pick{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--chip)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.client:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.grid-goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.goal{display:flex;flex-direction:column;gap:12px}
.goal .gtop{display:flex;align-items:flex-start;gap:12px}
.goal .tgt{font-family:var(--f-ipa);font-weight:700;font-size:1.6rem;line-height:1;min-width:58px;padding:10px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);text-align:center}
.goal .meta{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ready{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--good-soft);color:var(--good);padding:8px 12px;border-radius:8px;font-weight:700;font-size:.9rem}
.ladder{display:flex;gap:3px}
.ladder span{flex:1;height:6px;border-radius:3px;background:var(--chip)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
form.fgrid,.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted)}
/* session */
.sess{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.words{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.92rem}

table{border-collapse:collapse;width:100%;font-size:.92rem}

.lines{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

.sugg .item{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.feat td.same{color:var(--muted)}

@media (max-width:820px){.twocol{grid-template-columns:minmax(0,1fr)}}

/* assessment */
.qsrow{display:grid;grid-template-columns:34px minmax(80px,110px) minmax(0,1fr) 46px minmax(120px,170px);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}

/* vowel chart */

.elchip .pin[aria-pressed="true"]{color:var(--accent)}

.elchip.p{background:var(--warn-soft);border-color:var(--warn)} .elchip.p .lab{color:var(--warn);font-weight:700}
.elchip.n{background:var(--bad-soft);border-color:var(--bad)} .elchip.n .lab{color:var(--bad);font-weight:700}
.elchip .rec{font-size:.72rem;color:var(--good);margin-left:4px;font-weight:700}
.works{font-size:.85rem;display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px dashed var(--line)}

/* per-word scoring */
.chipbtn.cur,.pair.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.wr{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--good-soft);color:var(--good);font-variant-numeric:tabular-nums}

.wbar{display:grid;grid-template-columns:minmax(70px,auto) 1fr 44px;gap:8px;align-items:center;font-size:.85rem}
.wbar .tr{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}.wbar .tr i{display:block;height:100%;border-radius:4px}

.fc-card{background:var(--surface);border-radius:28px;box-shadow:0 12px 40px rgba(20,30,40,.12);width:min(560px,100%);aspect-ratio:4/5;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;padding:4vmin;position:relative;max-width:100%}

.fc-bar{display:grid;grid-template-columns:1fr auto auto 1fr;gap:10px;align-items:stretch;max-width:760px;width:100%;margin:0 auto}
.fc-btn{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 10px;font-weight:800;font-family:var(--f-display);font-size:1.25rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation}

@media (max-width:520px){.fc-bar{grid-template-columns:1fr 1fr;grid-template-areas:'no ok' 'bk sk'}.fc-btn.no{grid-area:no}.fc-btn.ok{grid-area:ok}.fc-bar .mid{padding:6px;flex-direction:row;gap:6px;justify-content:center}.fc-bar .mid:nth-child(2){grid-area:bk}.fc-bar .mid:nth-child(3){grid-area:sk}.fc-btn{font-size:1.15rem}.fc-top{flex-wrap:wrap;gap:6px}.fc-top>.row{order:1;width:100%;justify-content:flex-end}.fc-top .abacus{order:2;width:100%}.fc-top .row .btn{padding:4px 8px}.abacus{gap:8px;margin-top:8px}.ab-lab{font-size:14px}.abacus .bead{width:auto;flex:0 1 min(var(--bd,24px),4.4vw);min-width:7px;height:min(14px,3.4vw)}.abacus .ab-rod{gap:min(var(--bg-gap,6px),.8vw)}.abacus .ab-gap{min-width:3px}.abacus .ab-lab{font-size:14px}}

.abacus{max-width:760px;width:100%;margin:10px auto 0;display:flex;align-items:center;gap:12px}

/* ===== Ten Reps Later house style (paper + ink + Caslon) ===== */
.panel{border-color:var(--line);box-shadow:none}

.tabs{border-bottom:1px solid var(--ink)}
.tab{font-family:var(--f-serif);font-weight:400;font-size:1.02rem;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.label{font-weight:700;letter-spacing:.12em}

.kpi .big{letter-spacing:-.01em}
.goal .tgt{border-radius:3px;background:var(--accent-soft)}
.pill{border-radius:3px}
.chipbtn{border-radius:3px}

.rail .client{border-radius:2px}

.banner{border-radius:2px;background:var(--warn-soft)}

.modal .box{border-radius:4px}

/* home page now uses tokens so it follows light/dark */
.ny2{background:var(--surface);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7px color-mix(in srgb,var(--ink) 25%,transparent)}
.ny2 .btn{background:var(--surface);border-color:var(--ink);color:var(--ink)}

.ny2-kicker{color:var(--accent)}
.ny2-draw{color:var(--ink)}
.ny2-pic{border-color:var(--ink)}

/* ===== Minimal layer (Nov 2026): pale, rounded, big tap targets ===== */
:root{--f-display:"Nunito","Atkinson Hyperlegible",system-ui,sans-serif;--f-serif:"Nunito","Atkinson Hyperlegible",system-ui,sans-serif;--f-body:"Nunito","Atkinson Hyperlegible",system-ui,sans-serif;--ny-serif:var(--f-body);--ny-display:var(--f-body);--r:20px}
body{font-weight:600;font-size:16px}
h1,h2,h3,.top h1,.ny2-title,.empty h2,.head h2{font-family:var(--f-display)!important;font-weight:800!important;letter-spacing:-.01em}
.top h1 small{font-family:var(--f-body)!important;font-style:normal!important;font-weight:700}
.top{margin-bottom:22px}
.panel{border:0;border-radius:24px;background:var(--surface);box-shadow:0 1px 3px rgba(60,50,40,.05)}
.btn{min-height:46px;padding:10px 20px;border-radius:999px!important;border:1.5px solid var(--line)!important;background:var(--surface);font-weight:800;color:var(--ink)}
.btn.small{min-height:38px;padding:6px 14px;font-size:.88rem}
.btn.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent!important;background:transparent}
.tabs{border:0!important;background:var(--chip);padding:5px;border-radius:999px;gap:4px;margin-bottom:16px}
.tab{flex:1;font-family:var(--f-body)!important;font-weight:800!important;font-size:1rem!important;border:0!important;border-radius:999px;padding:12px 16px;margin:0;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button,.chipbtn,.pill,.goal .tgt,.rail .client,.banner,.toast,input[type=text],input[type=number],input[type=date],select,textarea,.modal .box{border-radius:14px}
.seg button,.chipbtn,.pill{border-radius:999px!important}
.seg button{min-height:40px;padding:8px 16px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-soft);box-shadow:none;color:var(--accent)}
.chipbtn{min-height:40px;padding:8px 14px}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=number],input[type=date],select,textarea{min-height:46px;border-color:var(--line);background:var(--bg)}
.rail .client{min-height:48px;border-radius:16px!important}
.rail .client[aria-current="true"]{background:var(--accent-soft);border-color:transparent!important;color:var(--accent)}
.big,.verdict,.kpi .big{font-family:var(--f-display)!important;font-weight:800!important}
.tbtn{border-radius:999px!important;border:0!important;min-height:92px;font-family:var(--f-body)!important;font-weight:800;font-size:1.6rem}
.tbtn small{font-size:.95rem}
.tbtn.ok{background:var(--good-soft);color:var(--good)}
.tbtn.no{background:var(--bad-soft);color:var(--bad)}
.label{letter-spacing:.12em;font-weight:800}
/* home */
.layout.home{grid-template-columns:minmax(0,1fr)}
.layout.home .rail{display:none}
.mh{max-width:760px;margin:0 auto;padding:6px 4px 24px}
.mh-date{color:var(--muted);font-weight:700;margin-bottom:18px}
.mh-row{display:flex;align-items:center;gap:16px;width:100%;padding:18px 18px;border:0;background:transparent;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;border-radius:0;min-height:84px}
.mh-row:hover,.mh-row:focus-visible{background:var(--accent-soft);border-radius:26px;border-bottom-color:transparent}
.mh-nm{font-weight:800;font-size:1.55rem;flex:0 1 auto;min-width:0}
.mh-age{font-weight:700;color:var(--muted);font-size:.95rem;margin-left:8px}
.mh-tg{flex:1;text-align:right;color:var(--muted);font-weight:700;font-size:1.02rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh-rd{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:800;white-space:nowrap}
.mh-go{width:52px;height:52px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:1.3rem}
.mh-row:hover .mh-go{background:var(--accent);border-color:var(--accent);color:#fff}
.mh-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.mh-q{color:var(--muted);font-weight:700}
@media (max-width:600px){.mh-tg{display:none}.mh-nm{font-size:1.3rem}.tab{padding:10px 8px;font-size:.92rem!important}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tbtn.ok,:root:not([data-theme="light"]) .tbtn.no{border:0!important}}

/* home doors */
.hm{max-width:780px;margin:0 auto;padding:30px 4px 30px;text-align:center;display:flex;flex-direction:column;align-items:center}
.hm-date{color:var(--muted);font-weight:700;margin-top:6px}
.hm-title{font-size:clamp(2.4rem,7vw,3.4rem)!important;font-weight:900!important;margin:4px 0 2px!important}
.hm-q{color:var(--muted);font-size:1.1rem;margin:4px 0 30px}
.hm-doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%}
.hm-door{min-height:150px;border:0;border-radius:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:800 1.2rem var(--f-body);transition:transform .15s}
.hm-door:hover{transform:translateY(-2px)}.hm-door:active{transform:scale(.98)}
.hm-door i{font-style:normal;font-size:2.4rem;line-height:1}.hm-door small{font-weight:700;opacity:.7;font-size:.9rem}
.d1{background:#E6EFE8;color:#3F6B52}.d2{background:#EEF0F7;color:#4D5A80}.d3{background:#FBF1E2;color:#8A6A2E}
.hm-rec{margin-top:26px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.hm-chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font:800 .95rem var(--f-body);cursor:pointer;min-height:42px}

function cvShape(word){
  const w0=String(word||'').toLowerCase().trim();if(!w0||/[\s]/.test(w0))return null;const w1=w0.replace(/[^a-z]/g,'');

    // consonant clusters spelled as one
    if(i===0&&(at('kn')||at('wr')||at('gn'))){out.push('C');i+=2;continue}
    if(at('tch')){out.push('C');i+=3;continue}
    if(at('dge')){out.push('C');i+=(i+3===n?3:2);continue}
    if(at('igh')){out.push('V');i+=3;continue}
    if(at('eigh')){out.push('V');i+=4;continue}
    if(at('ough')){out.push('V');i+=4;continue}
    if(at('augh')){out.push('V');i+=4;continue}
    if(i===n-2&&at('mb')){out.push('C');i+=2;continue}
    if(at('qu')){out.push('C','C');i+=2;continue}
    if(at('gu')&&i+2<n&&isV(w[i+2])){out.push('C');i+=2;continue}
    if(['sh','ch','th','ph','wh','ck','zh'].some(d=>at(d))){out.push('C');i+=2;continue}
    if(at('ng')){out.push('C');i+=2;continue}

    const rv=['aur','ear','eer','air','oar','oor','our','ure','ire','are','ere','ore','ar','er','ir','ur','or'].find(t=>at(t));

    if(c==='x'){out.push('C');if(i!==0)out.push('C');i++;continue}
    if(c==='h'&&i>0&&isV(w[i-1])&&(i===n-1||!isV(w[i+1]))){i++;continue}
    if(i>0&&w[i-1]===c&&!isV(c)){i++;continue}
    out.push('C');i++;
  }
  return out.join('');
}

async function persist(cid){
  const c=S.clients[cid];if(!c)return;
  if(S.mode!=='live'){return}
  if(saving[cid]){dirty[cid]=true;return}
  saving[cid]=true;
  try{await DB.collection('data/users/'+UID).doc(cid).set(JSON.parse(JSON.stringify(c)))}
  catch(e){toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete old clients or sessions.':'Couldn’t save just now. Try again in a moment.')}
  saving[cid]=false;if(dirty[cid]){dirty[cid]=false;persist(cid)}
}
async function removeClient(cid){
  delete S.clients[cid];if(S.cur===cid)S.cur=null;
  if(S.mode==='live'){try{await DB.collection('data/users/'+UID).doc(cid).delete()}catch(e){toast('Couldn’t delete. Try again.')}}
  render();
}
async function boot(){
  let db=null,user=null;
  if(window.claude&&claude.use){try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}}
  if(db&&user){try{UID=await user.id()}catch(e){UID=null}}
  if(db&&UID){
    DB=db;S.mode='live';
    try{DL=await claude.use('downloads')}catch(e){}
    let first=true;
    DB.collection('data/users/'+UID).onSnapshot(snap=>{
      const next={};snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='_settings'){S.settings=JSON.parse(JSON.stringify(v));PICS=Object.assign({},S.settings.pics||{});applyMyWords();return}next[d.id]=JSON.parse(JSON.stringify(v))});
      Object.keys(saving).forEach(k=>{if(saving[k]&&S.clients[k])next[k]=S.clients[k]});
      S.clients=next;if(S.cur&&!S.clients[S.cur])S.cur=null;
      if(first||!isTyping())render();first=false;
    },()=>{S.mode='demo';render()});
  }else{
    S.mode='demo';const ex=exampleClient();S.clients={[ex.id]:ex};S.cur=null;render();
    if(window.claude&&claude.use){try{DL=await claude.use('downloads')}catch(e){}}
  }
}
function isTyping(){const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox'))}
async function saveSettings(){if(S.mode!=='live')return;try{await DB.collection('data/users/'+UID).doc('_settings').set(JSON.parse(JSON.stringify(S.settings)))}catch(e){toast('Couldn’t save settings.')}}
function cur(){return S.clients[S.cur]||null}

function tabsBar(){const gi=TABGROUPS.findIndex(([,subs])=>subs.some(([k])=>k===S.tab));const g=TABGROUPS[gi<0?0:gi];if(gi>=0)LASTSUB[gi]=S.tab;

function goalsView(c){
  let h='';
  if(S.ui.goalForm)return goalForm(c);
  h+=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><span class="muted">${(c.goals||[]).length?'Mastery default: '+((c.goals[0]?.crit?.pct)??80)+'% over '+((c.goals[0]?.crit?.sessions)??3)+' sessions at the current level.':''}</span><button class="btn primary" data-act="newGoal">+ New goal</button></div>`;
  if(!(c.goals||[]).length)return h+`<div class="panel empty"><h2>No goals yet</h2><p>Add a target sound or process to start planning sessions.</p></div>`;
  h+=`<div class="grid-goals">`;
  const gs=[...c.goals].sort((a,b)=>(a.status==='achieved')-(b.status==='achieved'));
  gs.forEach(g=>{
    const L=levelsFor(g),m=mastery(c,g),gt=goalTitle(g),ss=sessionsOf(c,g.id),last=ss[ss.length-1];
    h+=`<article class="panel goal"><div class="gtop"><div class="tgt">${esc(goalBigLabel(g))}</div><div class="meta">
      <h3>${esc(gt.sub)}</h3><div class="muted" style="font-size:.85rem">${APPROACH[g.approach]}</div>
      <div class="row" style="margin-top:6px"><span class="pill"><span class="dot" style="background:var(--lv${g.level})"></span>${esc(L[g.level])}</span>
      ${g.status==='achieved'?'<span class="pill good">Achieved</span>':`<span class="pill ${m.streak?'good':''}">${Math.min(m.streak,m.need)} of ${m.need} at ≥${g.crit.pct}%</span>`}
      ${last?`<span class="pill">Last ${pctOf(last)}%</span>`:''}</div></div></div>
      <div class="ladder" title="Hierarchy progress">${L.map((x,i)=>`<span style="${i<=g.level?`background:var(--lv${i})`:''}" title="${esc(x)}"></span>`).join('')}</div>
      ${m.ready?`<div class="ready"><span>Criterion met. Ready for ${esc(L[g.level+1])}.</span><button class="btn small" data-act="levelUp" data-id="${g.id}">Move up</button></div>`:''}
      ${m.top&&g.status!=='achieved'?`<div class="ready"><span>Criterion met at the top level.</span><button class="btn small" data-act="achieve" data-id="${g.id}">Mark achieved</button></div>`:''}
      ${S.ui.famLink&&S.ui.famLink.g===g.id?`<div class="ready" style="background:var(--chip);color:var(--ink)"><input type="text" readonly value="${esc(S.ui.famLink.u)}" onclick="this.select()" style="flex:1;min-width:0"><span class="hint">Select and copy</span></div>`:''}
      ${chart(c,g)}
      ${worksHTML(c,g)}
      ${wordsHTML(c,g)}
      <div class="row"><button class="btn small primary" data-act="startSess" data-id="${g.id}">Start session</button>
      <button class="btn small" data-act="hwLink" data-id="${g.id}" title="Send home practice as a link or QR code">🏠 Homework link</button>
      <button class="btn small" data-act="editGoal" data-id="${g.id}">Edit</button>
      ${g.level>0?`<button class="btn small ghost" data-act="levelDown" data-id="${g.id}">Step down</button>`:''}
      ${g.status==='achieved'?`<button class="btn small ghost" data-act="reopen" data-id="${g.id}">Reopen</button>`:''}
      ${S.ui.confirm==='g'+g.id?`<button class="btn small danger" data-act="delGoal" data-id="${g.id}">Confirm delete</button>`:`<button class="btn small ghost danger" data-act="askDelGoal" data-id="${g.id}">Delete</button>`}</div>
    </article>`;
  });
  return h+`</div>`;
}



/* ============================== HOMEWORK LINK (family page on GitHub, words packed in the link) ============================== */
const HW_HOME='https://ppspeech.github.io/sound-check/family/';
function hwName(c){return String(c.name||'').replace(/^example\s*[–-]\s*/i,'').trim().slice(0,20)}
function hwItems(c,g){const s=S.sess&&S.sess.cid===c.id&&S.sess.goalId===g.id?S.sess:null;const disp=w=>GSDISP[String(w).toLowerCase()]||w;
  if(g.approach==='trad'){let ws=s&&s.words.length?s.words.slice():null;
    if(!ws){const all=tradWords(g).filter(x=>shapeOK(g,x));ws=[...all.filter(w=>picOf(w)),...all.filter(w=>!picOf(w))].slice(0,12)}
    return ws.slice(0,30).map(w=>[disp(w),picOf(w)||''])}
  let keys=s?s.words.filter(k=>String(k).includes('/')||BFORM[String(k).toLowerCase()]):[];
  if(!keys.length){const ps=pairsFor(g).map(p=>p[0]+'/'+p[1]);const pk=ps.filter(k=>picOf(k.split('/')[0]));keys=(pk.length>=6?pk:ps).slice(0,12)}
  return keys.slice(0,30).map(k=>{if(BFORM[String(k).toLowerCase()])return [disp(k),picOf(k)||''];const [a,b]=k.split('/');return [a,picOf(a)||'',b]})}
function hwURL(c,g){const w=hwItems(c,g);if(!w.length)return '';const gt=goalTitle(g);
  const o={n:hwName(c),t:(goalBigLabel(g)+' · '+gt.sub).slice(0,60),w};if(g.approach==='trad'&&FAMK.includes(g.target))o.k=g.target;
  const u=new TextEncoder().encode(JSON.stringify(o));let b='';u.forEach(x=>b+=String.fromCharCode(x));
  return HW_HOME+'#h='+btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function hwQR(url){try{if(url.length>1800)return '';const q=qrcode(0,'L');q.addData(url,'Byte');q.make();return q.createSvgTag({cellSize:4,margin:4,scalable:true})}catch(e){return ''}}
function hwModal(c){const g=(c.goals||[]).find(x=>x.id===S.ui.hw);if(!g)return '';const url=hwURL(c,g),items=hwItems(c,g),name=hwName(c)||'your child',qr=url?hwQR(url):'';
  const fromSess=S.sess&&S.sess.cid===c.id&&S.sess.goalId===g.id&&S.sess.words.length;
  if(!url)return `<div class="modal" role="dialog" aria-modal="true"><div class="box"><div class="head" style="margin:0"><h2>Homework link</h2><button class="btn ghost" data-act="hwClose">Close</button></div><p class="muted">No words for this goal yet.</p></div></div>`;
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Homework link"><div class="box hwbox">
   <div class="head" style="margin:0 0 10px"><div><span class="label">Homework link</span><h2>${esc(goalBigLabel(g))} · ${esc(goalTitle(g).sub)}</h2></div><button class="btn ghost" data-act="hwClose">Close</button></div>
   <div class="hwgrid"><div class="hwl"><p style="margin:0 0 8px">Opens on their phone or iPad: flashcards, games and stars. Progress stays on their device. Only “${esc(name)}” and the words go in the link.</p>
     <input type="text" readonly id="hw-url" value="${esc(url)}" onclick="this.select()" aria-label="Homework link">
     <div class="row" style="margin-top:10px"><button class="btn primary" data-act="hwCopy">Copy link</button><a class="btn" href="sms:?&body=${encodeURIComponent(`Here’s ${name}’s speech practice: ${url}`)}">Text it</a><a class="btn" href="mailto:?subject=${encodeURIComponent(`${name}’s speech practice`)}&body=${encodeURIComponent(`Hi! Here’s ${name}’s practice for this week. Open it on a phone or iPad:\n\n${url}`)}">Email it</a><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Preview</a></div>
     <div class="sub"><span class="label">${items.length} words · ${fromSess?'the ones selected in today’s session':'picked automatically (select words in a session to choose your own)'}</span><div class="words" style="margin-top:6px">${items.map(x=>`<span class="pill">${x[1]?x[1]+' ':''}${esc(x[0])}${x[2]?` <span class="muted" style="font-weight:600">not ${esc(x[2])}</span>`:''}</span>`).join('')}</div></div></div>
    <div class="hwq">${qr?qr+'<small class="hint">Scan with the phone camera</small>':'<small class="hint">Too many words for a QR code. Copy or text the link instead.</small>'}</div></div></div></div>`}
const FAMK=['p','b','t','d','k','g','f','v','th','s','z','sh','h','ch','j','m','n','ng','l','r','w','y','cs','cl','cr'];
function famURL(c,g){if(g.approach!=='trad'||!FAMK.includes(g.target))return '';const cl=['cs','cl','cr'].includes(g.target);const p=['i','m','f'].includes(g.position)?g.position:'i';
  const nm=String(c.name||'').replace(/^example\s*[–-]\s*/i,'').trim().slice(0,20);

function chart(c,g){

    const vi=segs.map((x,i)=>isC(x)?-1:i).filter(i=>i>=0),fv=vi[0]??0,lv=vi[vi.length-1]??segs.length;
    segs.forEach((x,i)=>{const sv=subOf(sc,n,i),bad=sv!==undefined;

function buildSummary(c,who){
  const L=[];const ss=[...(c.sessions||[])].sort((a,b)=>a.date<b.date?-1:1);const qs=(c.ax||[]).filter(a=>a.type==='qs').sort((a,b)=>a.date<b.date?-1:1);const ics=(c.ax||[]).filter(a=>a.type==='ics'&&icsMean(a)!=null).sort((a,b)=>a.date<b.date?-1:1);

function errExamples(q){const out={};if(!q)return out;QS.forEach(([n,w,t])=>{const segs=t.split(' ');segs.forEach((x,i)=>{if(!isC(x))return;const v=subOf(q,n,i);if(v===undefined)return;const k=CMAP[x];(out[k]=out[k]||[]).push({w,tx:(q.tx||{})[n]||autoTx(q,n,segs),v,pos:regions(segs).on.includes(i)?'i':regions(segs).co.includes(i)?'f':'m'})})});return out}

function ageRuler(m,lo,hi){const W0=600,pl=10,pr=10,x=v=>pl+(Math.min(Math.max(v,lo),hi)-lo)/(hi-lo)*(W0-pl-pr);let s=`<svg class="chart" viewBox="0 0 ${W0} 34" aria-hidden="true">`;

  if(m!=null)s+=`<circle cx="${x(m)}" cy="17" r="6" fill="var(--accent)"/><text x="${x(m)}" y="9" text-anchor="middle" style="fill:var(--accent);font-weight:700">${m>hi?fmtM(m)+' →':fmtM(m)}</text>`;
  return s+`</svg>`}

   <div class="otable"><div style="min-width:560px">${sv}</div></div><p class="hint" style="margin:6px 0 0">Each bar ends at the age most children stop using that pattern (Grunwell, 1987, in Bowen, 2015). Coloured bars are present for this client; the dashed line is their age.</p></section>`;
  /* ---- C: progress ---- */

    const W1=600,H1=200,l=34,rr=78,t=10,bt=26,w=W1-l-rr,hh=H1-t-bt,n=pts.length,X=i=>l+(n===1?w/2:i*w/(n-1)),Y=v=>t+hh-(v/100)*hh;

  let h=`<div class="pmvwrap"><table class="pmv"><thead><tr><th></th>${PLACES.map(p=>`<th>${p[1]}</th>`).join('')}</tr></thead><tbody>`;
  MANNERS.forEach(([mk,ml])=>{h+=`<tr><th class="rowh">${ml}</th>`;PLACES.forEach(([pk])=>{const ks=Object.keys(FEAT).filter(k=>FEAT[k][0]===pk&&FEAT[k][1]===mk).sort((a,b)=>FEAT[a][2]-FEAT[b][2]);
    h+=`<td><div class="pcell">${ks.map(k=>{const st=inv[k]?.st||'';const age=m!=null?(m>=BAND[k]+12?'exp':m>=BAND[k]?'dev':''):'';const tip=`/${ipaOf(k)}/ ${describe(k)}${st?' · '+STAT.find(x=>x[0]===st)[1]:''}${inv[k]?.acc?' · '+inv[k].acc:''}`;return interactive?`<button class="ph ${st} ${age}" data-act="psel" data-k="${k}" aria-pressed="${sel===k}" title="${tip}">${ipaOf(k)}${gs.has(k)?'<span class="gdot"></span>':''}</button>`:`<span class="ph ${st} ${age}" style="cursor:default;${showSub&&inv[k]?.sub?'height:auto;padding:3px 4px;display:flex;flex-direction:column;line-height:1.1':''}" title="${tip}">${ipaOf(k)}${showSub&&inv[k]?.sub&&inv[k].st!=='ok'?`<small style="font-size:.66rem;font-weight:500">→${esc(subIpa(inv[k].sub))}</small>`:''}</span>`}).join('')}</div></td>`});h+=`</tr>`});
  h+=`</tbody></table></div><div class="legend"><span><span class="sw" style="background:var(--good-soft)"></span>Correct</span><span><span class="sw" style="background:var(--warn-soft)"></span>Inconsistent</span><span><span class="sw" style="background:color-mix(in srgb,var(--lv1) 22%,var(--surface))"></span>Error, stimulable</span><span><span class="sw" style="background:var(--bad-soft)"></span>Error, not stimulable</span><span><span class="sw" style="background:var(--chip)"></span>Not assessed</span>${m!=null?`<span><span class="sw" style="background:var(--chip);border-color:var(--ink)"></span>Expected by ${fmtM(m)}</span><span><span class="sw" style="background:var(--chip);border:1.5px dashed var(--muted)"></span>Developing now</span>`:''}${interactive?`<span><span class="sw" style="background:var(--accent);border-radius:50%;width:10px;height:10px"></span>Active goal</span>`:''}<span>Voiceless left, voiced right</span></div>`;
  return h;
}
function vowelChart(vinv,vsel,interactive){
  const W0=560,H0=330,L=70,R=520,T=36,B=290;
  const X=(x,y)=>{const top=L+(0)*(R-L),lx=L+(R-L)*.28*y;return lx+x*(R-lx)},Y=y=>T+y*(B-T);
  const pos=k=>{if(Array.isArray(k))return [X(k[0],k[1]),Y(k[1])];const v=VOW.find(q=>q[0]===k);return [X(v[3],v[4]),Y(v[4])]};
  let h=`<svg class="vchart" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Australian English vowel chart"><defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>`;
  h+=`<path d="M${X(0,0)},${Y(0)} L${X(1,0)},${Y(0)} L${X(1,1)},${Y(1)} L${X(0,1)},${Y(1)} Z" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>`;
  h+=`<line x1="${X(.5,0)}" y1="${Y(0)}" x2="${X(.5,1)}" y2="${Y(1)}" stroke="var(--line)" stroke-dasharray="3 4"/><line x1="${X(0,.5)}" y1="${Y(.5)}" x2="${X(1,.5)}" y2="${Y(.5)}" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  h+=`<text class="axis" x="${X(0,0)}" y="${T-14}" text-anchor="middle">FRONT</text><text class="axis" x="${X(.5,0)}" y="${T-14}" text-anchor="middle">CENTRAL</text><text class="axis" x="${X(1,0)}" y="${T-14}" text-anchor="middle">BACK</text>`;
  h+=`<text class="axis" x="${L-12}" y="${Y(0)+4}" text-anchor="end">HIGH</text><text class="axis" x="${X(0,.5)-12}" y="${Y(.5)+4}" text-anchor="end">MID</text><text class="axis" x="${X(0,1)-12}" y="${Y(1)+4}" text-anchor="end">LOW</text>`;
  DIPH.forEach(([k,,,a,b],i)=>{const [x1,y1]=pos(a),[x2,y2]=pos(b);const mx=(x1+x2)/2+(i%2?10:-10),my=(y1+y2)/2+(i%2?-8:8);const st=vinv[k]?.st||'';
    h+=`<path class="dip" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" marker-end="url(#arw)"/>`;
    h+=`<g class="vg ${st} ${vsel===k?'sel':''}" ${interactive?`data-act="vsel" data-k="${k}"`:''}><rect x="${mx-17}" y="${my-11}" width="34" height="20" rx="5" fill="var(--surface)" stroke="${st?'var(--ink)':'var(--accent)'}" stroke-opacity=".5"/><text class="diplab" x="${mx}" y="${my+4}" text-anchor="middle" style="${st==='err'?'fill:var(--bad)':st==='inc'?'fill:var(--warn)':st==='ok'?'fill:var(--good)':''}">${k}</text><title>/${k}/ ${DIPH.find(d=>d[0]===k)[1].toUpperCase()} as in “${DIPH.find(d=>d[0]===k)[2]}”</title></g>`});
  VOW.forEach(v=>{const [x,y]=pos(v[0]);const st=vinv[v[0]]?.st||'';
    h+=`<g class="vg ${st} ${v[7]?'rd':''} ${vsel===v[0]?'sel':''}" ${interactive?`data-act="vsel" data-k="${v[0]}"`:''}><circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+5}" text-anchor="middle">${v[0]}</text><title>/${v[0]}/ ${v[1].toUpperCase()} as in “${v[2]}” · ${v[5]} ${v[6]}${v[7]?' rounded':''}${v[8]?' long':''}</title></g>`});
  return h+`</svg>`;
}

  ${VOW.map(v=>`<tr><td class="ipa" style="font-size:1.1rem">/${v[0]}/</td><td>${v[1].toUpperCase()}</td><td>${v[2]}</td><td>${v[5]}</td><td>${v[6]}</td><td>${v[7]?'rounded':'spread'}</td><td>${v[8]?'long':'short'}</td><td>${vinv[v[0]]?.st?STAT.find(x=>x[0]===vinv[v[0]].st)[1]:'<span class="muted">–</span>'}</td></tr>`).join('')}

  </tbody></table></div><p class="hint" style="margin:8px 0 0">Australian English (non-rhotic) vowels using Cox &amp; Palethorpe’s HCE symbols. Placement is approximate and for planning.</p>`;
}

    const okL=exp.filter(k=>inv[k]?.st==='ok');
    const devErr=dev.filter(k=>['err','stim','inc'].includes(inv[k]?.st||''));

      ${p.atyp?'<span class="tag atyp">Atypical</span>':due?'<span class="tag pri">Priority</span>':'<span class="tag opt">Age-appropriate</span>'}

    h+=`</div><p class="hint" style="margin:12px 0 0">Sound norms: McLeod &amp; Crowe (2018), age by which 90% of children produce each consonant. Process ages: Grunwell (1987), as tabled in Bowen (2015). Use clinical judgement alongside intelligibility, stimulability and family priorities.</p></section>`;

  return h+`</div>`;
}

function sessionView(c){
  const goals=(c.goals||[]).filter(g=>g.status!=='achieved');
  if(!goals.length)return `<div class="panel empty"><h2>No active goals</h2><p>Add a goal first, then run sessions here.</p><button class="btn primary" data-act="tab" data-tab="goals">Go to goals</button></div>`;
  if(!S.sess||S.sess.cid!==c.id||!goals.find(g=>g.id===S.sess.goalId))newSess(c,goals[0].id);

/* ============================== MY WORDS (user word bank) ============================== */
const MYW_ADDED={};
function mwPosOpts(k){if(CLUSTERS[k])return [...Object.keys(CLUSTERS[k].groups).map(g=>[g,g.replace(/^-/,'ending -')]),['__new','other']];return [['i','Start'],['m','Middle'],['f','End']]}
function applyMyWords(){(S.settings.words||[]).forEach(o=>{const lw=o.w.toLowerCase();if(o.pic)PICS[lw]=PICS[lw]||o.pic;let arr;
  if(CLUSTERS[o.k]){const gr=CLUSTERS[o.k].groups;const key=o.p==='__new'?'other':o.p;gr[key]=gr[key]||[];arr=gr[key]}else{W[o.k]=W[o.k]||{i:[],m:[],f:[]};arr=W[o.k][o.p]=W[o.k][o.p]||[]}
  if(!arr.includes(o.w)){arr.unshift(o.w);MYW_ADDED[o.k+'|'+o.p+'|'+o.w]=1}})}
function removeMyWord(i){const o=(S.settings.words||[])[i];if(!o)return;S.settings.words.splice(i,1);let arr;if(CLUSTERS[o.k]){arr=CLUSTERS[o.k].groups[o.p==='__new'?'other':o.p]}else arr=(W[o.k]||{})[o.p];if(arr&&MYW_ADDED[o.k+'|'+o.p+'|'+o.w]){const j=arr.indexOf(o.w);if(j>=0)arr.splice(j,1);delete MYW_ADDED[o.k+'|'+o.p+'|'+o.w]}}
function myWordForm(prefK,prefP){const k=S.ui.mwK||prefK||'s',opts=mwPosOpts(k),pp=S.ui.mwP&&opts.some(o=>o[0]===S.ui.mwP)?S.ui.mwP:(prefP&&opts.some(o=>o[0]===prefP)?prefP:opts[0][0]);
  const mine=(S.settings.words||[]).map((o,i)=>[o,i]).filter(([o])=>o.k===k);
  return `<div class="mwf"><div class="mwf-row">
   <label class="field"><span class="label">Word</span><input type="text" id="mw-w" placeholder="e.g. snorkel" autocomplete="off"></label>
   <label class="field"><span class="label">Sound</span><select id="mw-k">${SOUNDS.map(([kk,ipa])=>`<option value="${kk}" ${kk===k?'selected':''}>/${ipa}/</option>`).join('')}${Object.entries(CLUSTERS).map(([kk,v])=>`<option value="${kk}" ${kk===k?'selected':''}>${esc(v.label)}</option>`).join('')}</select></label>
   <label class="field"><span class="label">${CLUSTERS[k]?'Cluster':'Position'}</span><select id="mw-p">${opts.map(([v,l])=>`<option value="${v}" ${v===pp?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
   <label class="field" style="max-width:110px"><span class="label">Picture</span><input type="text" id="mw-pic" placeholder="🐌" autocomplete="off"></label>
  </div><div class="row" style="margin-top:8px"><button class="btn small primary" data-act="mwSave">Add word</button><span class="hint">Picture is optional: paste or type one emoji. Added words show for every client.</span></div>
  ${mine.length?`<div class="sub"><span class="label">Your words for ${CLUSTERS[k]?esc(CLUSTERS[k].label):'/'+ipaOf(k)+'/'}</span><div class="words">${mine.map(([o,i])=>`<span class="chipbtn mwchip">${o.pic?o.pic+' ':''}${esc(o.w)} <small>${esc((mwPosOpts(o.k).find(x=>x[0]===o.p)||['',''])[1])}</small><button data-act="mwDel" data-i="${i}" aria-label="Remove ${esc(o.w)}">✕</button></span>`).join('')}</div></div>`:''}</div>`}


/* ============================== PAIR GAME (minimal pairs: child talks, you pick what you heard) ============================== */
let MPGT='monster';try{MPGT=localStorage.getItem('sc-mpgt')||'monster'}catch(e){}
function mpgNext(){const M=S.mpg;let p=M.pairs[Math.floor(Math.random()*M.pairs.length)];if(M.pairs.length>1)for(let t=0;t<6&&M.cur&&p===M.cur;t++)p=M.pairs[Math.floor(Math.random()*M.pairs.length)];M.cur=p;M.flip=Math.random()<.5;M.phase='pick';M.heard=null;M.ok=null}
function monsterSVG(f){const eyes=f==='happy'?'<path d="M84 104 q16 -16 32 0 M144 104 q16 -16 32 0" stroke="#2E2A40" stroke-width="7" fill="none" stroke-linecap="round"/>':f==='huh'?'<circle cx="100" cy="100" r="20" fill="#fff"/><circle cx="160" cy="100" r="15" fill="#fff"/><circle cx="96" cy="96" r="8" fill="#2E2A40"/><circle cx="164" cy="96" r="7" fill="#2E2A40"/>':'<circle cx="100" cy="100" r="20" fill="#fff"/><circle cx="160" cy="100" r="20" fill="#fff"/><circle cx="104" cy="104" r="9" fill="#2E2A40"/><circle cx="156" cy="104" r="9" fill="#2E2A40"/>';
  const mouth=f==='open'?'<ellipse cx="130" cy="168" rx="44" ry="34" fill="#4A2E5C"/><ellipse cx="130" cy="186" rx="22" ry="10" fill="#E77C9A"/>':f==='happy'?'<path d="M84 150 Q130 214 176 150 Q130 172 84 150Z" fill="#4A2E5C"/><path d="M100 158 l8 13 l8 -11 M144 158 l8 11 l8-13" fill="#fff"/>':f==='huh'?'<path d="M100 172 q15 -12 30 0 q15 12 30 0" stroke="#4A2E5C" stroke-width="7" fill="none" stroke-linecap="round"/><text x="210" y="60" font-size="54" font-weight="900" fill="#7A68C8" font-family="Nunito,sans-serif">?</text>':'<path d="M84 150 Q130 206 176 150 Q130 170 84 150Z" fill="#4A2E5C"/><path d="M100 157 l8 12 l8 -10 M144 157 l8 10 l8-12" fill="#fff"/>';
  return `<svg class="mpg-mon ${f}" viewBox="0 0 260 250" aria-hidden="true"><ellipse cx="130" cy="238" rx="90" ry="10" fill="rgba(80,60,140,.12)"/><path d="M70 50 L60 14 L92 42Z M190 50 L200 14 L168 42Z" fill="#9C8BE0"/><path d="M40 232 C30 120 60 40 130 40 C200 40 230 120 220 232 Z" fill="#9C8BE0"/>${eyes}${mouth}<circle cx="70" cy="140" r="10" fill="#F4B6C8" opacity=".75"/><circle cx="190" cy="140" r="10" fill="#F4B6C8" opacity=".75"/></svg>`}
function boardSVG(f){return `<svg class="mpg-board ${f}" viewBox="0 0 260 250" aria-hidden="true"><rect x="122" y="196" width="16" height="50" rx="6" fill="#C9B79C"/>${[100,82,64,46,28,12].map((r,i)=>`<circle cx="130" cy="110" r="${r}" fill="${i%2?'#FFFFFF':i===5?'#E2645A':'#7FB6A0'}"/>`).join('')}${f==='happy'?'<text x="130" y="22" text-anchor="middle" font-size="26" font-weight="900" fill="#3F6B52" font-family="Nunito,sans-serif">Bullseye!</text>':f==='huh'?'<text x="130" y="22" text-anchor="middle" font-size="26" font-weight="900" fill="#9A5A50" font-family="Nunito,sans-serif">Missed!</text>':''}</svg>`}
const DART='<svg class="mpg-dart" viewBox="0 0 60 60" aria-hidden="true"><path d="M8 52 L34 26" stroke="#4A4440" stroke-width="5" stroke-linecap="round"/><path d="M34 26 L48 12" stroke="#B9A98F" stroke-width="3"/><path d="M44 8 L56 4 L52 16 Z M40 12 L54 18 L46 20Z" fill="#E2645A"/></svg>';
function mpgView(){
  const M=S.mpg,[a,b]=M.cur,side=M.flip?[b,a]:[a,b],mon=M.theme==='monster';
  const face=M.phase==='ask'?(mon?'open':''):M.phase==='react'?(M.ok?'happy':'huh'):'';
  const heardW=M.heard!=null?side[M.heard]:null,other=heardW===a?b:a;
  const tip=M.phase==='pick'?'Child says one word. You tap the one you <b>heard</b>.':M.phase==='ask'?`You heard <b>${esc(heardW)}</b>. Is that what they meant?`:M.ok?(mon?`Yum! <b>${esc(heardW)}</b>!`:`Bullseye: <b>${esc(heardW)}</b>!`):(mon?`Hmm… I got <b>${esc(heardW)}</b>. You meant <b>${esc(other)}</b>!`:`Oops, the dart hit <b>${esc(heardW)}</b>. You meant <b>${esc(other)}</b>!`);
  const card=(w,i)=>{const hd=M.heard===i;return `<button class="mpg-card ${i?'R':'L'} ${hd?(M.phase==='ask'?(mon?'eaten':'hit'):(mon?'gone':'hit stuck')):''}" data-act="mpgPick" data-i="${i}" ${M.phase==='pick'?'':'disabled'}><i>${picOf(w)||'💬'}</i><span>${esc(w)}</span>${hd&&!mon?DART:''}</button>`};
  return `<div class="mpg th-${M.theme}" role="dialog" aria-modal="true" aria-label="Pair game"><div class="mpg-top"><button class="mpg-x" data-act="mpgClose" aria-label="Close">✕</button><span class="mpg-sc">${mon?'🍪':'🎯'} ${M.fed} ${mon?'fed':'thrown'} · ${M.matched} matched</span><button class="mpg-x mpg-th" data-act="mpgTheme" title="Switch game">${mon?'🎯':'👾'}</button></div>
   <div class="mpg-tip">${tip}</div>
   <div class="mpg-stage">${card(side[0],0)}<div class="mpg-mid">${mon?monsterSVG(face):boardSVG(face)}</div>${card(side[1],1)}</div>
   <div class="mpg-ask">${M.phase==='ask'?`<button class="mpg-y" data-act="mpgYes">✓ That’s what they meant</button><button class="mpg-n" data-act="mpgNo">✗ They meant ${esc(other)}</button>`:M.phase==='pick'?`<button class="mpg-skip" data-act="mpgSkip">Skip pair ›</button>`:''}</div></div>`}
/* ============================== EVENTS ============================== */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;const c=cur();
  switch(a){
   case 'mwOpen':S.ui.mwOpen=!S.ui.mwOpen;S.ui.mwK=null;S.ui.mwP=null;render();if(S.ui.mwOpen)setTimeout(()=>$('#mw-w')?.focus(),0);break;
   case 'mwSave':{const w=($('#mw-w')?.value||'').trim().toLowerCase(),k=$('#mw-k').value,pp=$('#mw-p').value,pic=($('#mw-pic')?.value||'').trim();
     if(!w){toast('Type a word first.');return}if(w.length>30){toast('Keep it to one word or a short phrase.');return}if(pic&&[...pic].length>8){toast('Use one emoji for the picture.');return}
     S.settings.words=S.settings.words||[];if(S.settings.words.some(o=>o.w===w&&o.k===k&&o.p===pp)){toast('Already in your words.');return}{const ex=CLUSTERS[k]?(CLUSTERS[k].groups[pp==='__new'?'other':pp]||[]):((W[k]||{})[pp]||[]);if(ex.includes(w)){if(pic){PICS[w]=pic;S.settings.pics=Object.assign({},S.settings.pics||{},{[w]:pic});saveSettings();toast(`“${w}” is already in the bank. Picture updated.`)}else toast(`“${w}” is already in the bank.`);render();return}}
     S.settings.words.push({w,k,p:pp,pic:pic||''});if(pic){PICS[w]=pic;S.settings.pics=Object.assign({},S.settings.pics||{},{[w]:pic})}applyMyWords();saveSettings();S.ui.mwK=k;S.ui.mwP=pp;
     const sq=S.sess;if(S.tab==='session'&&sq&&c){const g=c.goals.find(x=>x.id===sq.goalId);if(g&&g.target===k&&!sq.words.includes(w))sq.words=[...sq.words,w]}
     toast(`Added “${w}”`);render();setTimeout(()=>$('#mw-w')?.focus(),0);break}
   case 'mwLibT':S.ui.mwLib=!S.ui.mwLib;S.ui.mwK=null;S.ui.mwP=null;render();break;
   case 'mwDel':{removeMyWord(+b.dataset.i);saveSettings();render();break}
   case 'mpgOpen':{const s=S.sess,g=c.goals.find(x=>x.id===s.goalId);let keys=(s.words||[]).filter(k=>String(k).includes('/'));let pairs=keys.length?keys.map(k=>k.split('/')):pairsFor(g);const pk=pairs.filter(p=>picOf(p[0])&&picOf(p[1]));if(pk.length>=3)pairs=pk;if(!pairs.length){toast('No pairs for this goal yet.');return}
     S.mpg={theme:MPGT,pairs,fed:0,matched:0};mpgNext();render();break}
   case 'mpgClose':S.mpg=null;render();break;
   case 'mpgTheme':{MPGT=S.mpg.theme=S.mpg.theme==='monster'?'darts':'monster';try{localStorage.setItem('sc-mpgt',MPGT)}catch(e){}render();break}
   case 'mpgSkip':mpgNext();render();break;
   case 'mpgPick':{const M=S.mpg;if(M.phase!=='pick')return;M.heard=+b.dataset.i;M.phase='ask';M.fed++;render();break}
   case 'mpgYes':case 'mpgNo':{const M=S.mpg;if(M.phase!=='ask')return;M.ok=a==='mpgYes';if(M.ok)M.matched++;recTrial(M.ok,M.cur[0]);M.phase='react';render();setTimeout(()=>{if(S.mpg===M&&M.phase==='react'){mpgNext();render()}},M.ok?1300:2200);break}
   case 'hwLink':S.ui.hw=id;render();break;
   case 'hwClose':S.ui.hw=null;render();break;
   case 'hwCopy':{const i=$('#hw-url');try{await navigator.clipboard.writeText(i.value);toast('Link copied')}catch(err){i.select();try{document.execCommand('copy');toast('Link copied')}catch(e2){toast('Select the link and copy it')}}break}
   case 'famLink':{const g=c.goals.find(x=>x.id===id),u=famURL(c,g);try{await navigator.clipboard.writeText(u);S.ui.famLink=null;toast('Family link copied. Paste it into a text or email.')}catch(err){S.ui.famLink={g:id,u}}render();break}
   case 'caseOpen':S.ui={caselist:true};render();window.scrollTo(0,0);break;
   case 'caseBack':S.ui={};render();break;
   case 'pick':S.cur=id;addRecent(id);if(S.tab==='library')S.tab='goals';S.ui={};render();break;
   case 'lib':S.tab=S.tab==='library'?'goals':'library';S.ui={};render();break;
   case 'tab':S.tab=b.dataset.tab;S.ui={};render();break;
   case 'addClient':S.ui={addClient:true};render();setTimeout(()=>$('#cf-name')?.focus(),0);break;
   case 'editClient':S.ui={addClient:true,editClient:true};render();break;
   case 'cancelClient':S.ui={};render();break;
