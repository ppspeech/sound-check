.brp-main{padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.brp-stage{position:relative;width:100%;height:min(320px,48vh);background:#fff;border-radius:18px;border:1px solid #ece4d6;overflow:hidden;touch-action:none;user-select:none}
.brp-piece{position:absolute;top:22%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;border-radius:18px;background:#fbf6ea;border:2px solid #e6dcc8;min-width:96px;transition:opacity .3s,transform .3s}
.brp-piece b{font-size:clamp(24px,4vw,36px);font-weight:700}
.brp-piece.a{background:#e9f3ee;border-color:#9cc9b2;color:#2f6b55;cursor:grab;z-index:2}
.brp-piece.a.drag{cursor:grabbing;transform:scale(1.05)}
.brp-piece.b{left:62%}.brp-piece.dim{opacity:.35}
.brp-piece.gone,.brp-snake.gone,.brp-hlab.gone{opacity:0;transform:scale(.8);transition:opacity .3s,transform .3s}
.brp-pic{font-size:clamp(40px,7vw,64px);line-height:1}.brp-pic.big{font-size:clamp(64px,11vw,110px)}
.brp-res{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.brp-res b{font-size:clamp(34px,6vw,56px);color:#a33a3a}
.brp-res.pop{animation:brpPop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes brpPop{from{transform:scale(.6);opacity:0}}
.brp-say{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:clamp(20px,3.2vw,28px);font-weight:700;color:#5d5246}
.brp-say b{color:#a33a3a}
.brp-steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.brp-steps button{border:1px solid #e6dfd2;background:#fff;border-radius:10px;padding:7px 12px;font-size:14px}
.brp-tip{margin:0;font-size:13px;color:#857a6e}
.brp-snake{position:absolute;left:4%;top:38%;width:8%;height:30px;border-radius:16px;background:repeating-linear-gradient(90deg,#8cc9a5 0 16px,#76b893 16px 32px);transition:width .08s linear}
.brp-hlab{position:absolute;left:4%;top:20%;font-size:clamp(24px,4vw,36px);font-weight:800;color:#2f6b55;letter-spacing:1px;white-space:nowrap;max-width:70%;overflow:hidden}
.brp-piece#brpB{transition:left .35s cubic-bezier(.3,1.3,.5,1),opacity .3s,transform .3s}
.brp-hold{width:min(420px,100%);padding:16px;border-radius:16px;border:2px solid #9cc9b2;background:#e9f3ee;color:#2f6b55;font-size:20px;font-weight:800;touch-action:none;user-select:none}
.brp-hold.on{background:#cfe9db;transform:scale(.98)}.brp-hold:disabled{opacity:.5}
.brp-stage.river{background:linear-gradient(180deg,#fff 0 38%,#cfe8f5 38% 82%,#e9f3ee 82%)}
.brp-frog{position:absolute;top:30%;font-size:48px;transition:left .45s cubic-bezier(.3,1.4,.5,1);z-index:2}
.brp-bank{position:absolute;right:4%;top:22%}
.brp-stones{position:absolute;left:14%;right:16%;top:52%;display:flex;justify-content:space-between;gap:8px}
.brp-stone{min-width:86px;padding:10px 12px;border-radius:50%;border:0;background:#ddd3c2;font-size:14px;font-weight:700;color:#5d5246;box-shadow:0 4px 0 #c4b79f}
.brp-stone.done{background:#a33a3a;color:#fff;box-shadow:0 4px 0 #7d2a2a}
.brp-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid #e6dfd2;background:#fbf8f2;visibility:hidden}
.brp-foot.show{visibility:visible}
.brp-g{border:1.5px solid #ddd5c8;background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;color:#6b5f55}
.brp-ok{border:0;background:#cfe7ea;color:#1f5560;border-radius:999px;padding:10px 22px;font-size:15px;font-weight:700}
.brp-cfx{position:absolute;width:0;height:0;pointer-events:none;z-index:3}.brp-cfx i{position:absolute;width:9px;height:6px;border-radius:2px;animation:brpC .85s ease-out forwards}
@keyframes brpC{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
.gs-bc{position:relative}
.gs-play{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:12px;cursor:pointer;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.brp-res.pop{animation:none}}
</style>
<script id="brp-js">
/* ===== Bridge it play: Slide it in / Hold the hiss / Stepping stones ===== */
(function(){
  const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let B=null, lastMode="slide"; // {list:[{bk,it}], i, mode, k, done, goes, step, x}
  const pic=w=>{ try{ return picOf(w)||""; }catch(e){ return ""; } };
  function parts(it){
    if(it.F) return {A:it.lab[0],B:it.lab[1],W:it.lab[2],pa:it.e[0],pb:it.e[1],pw:it.e[2]};
    if(it.S) return {A:it.S[0],B:it.S[1],W:it.S[2],pa:it.e1||"",pb:it.em||"",pw:pic(it.S[2])||it.e2||""};
    if(it.C) return {A:it.C[0],B:it.C[1],W:it.C[2],pa:"",pb:pic(it.C[1])||it.e1||"",pw:pic(it.C[2])||it.e2||""};
    if(it.R) return {A:it.R[0],B:it.R[1],W:it.R[2],pa:"",pb:it.e1||"",pw:pic(it.R[2])||it.e2||""};
    if(it.L){ const m=String(it.L[1]).split(/[‑-]/); return {A:m[0]||it.L[0],B:m.slice(1).join("")||"",W:it.L[2],pa:"",pb:"",pw:it.e&&it.e!=="pic"?it.e:pic(it.L[2])}; }
    return {A:it[0],B:it[1],W:it[0]+" "+it[1],pa:it[2]||"",pb:it[3]||"",pw:(it[2]||"")+(it[3]||""),phrase:true};
  }
  function boom(host,x,y){ const b=document.createElement("div"); b.className="brp-cfx"; b.style.left=x+"px"; b.style.top=y+"px"; const cs=["#ff6b8b","#ffb020","#4fc3f7","#8e7cff","#5fcf8c"];
    for(let k=0;k<20;k++){ const e=document.createElement("i"), a=Math.random()*6.28, d=40+Math.random()*70; e.style.setProperty("--x",(Math.cos(a)*d).toFixed(0)+"px"); e.style.setProperty("--y",(Math.sin(a)*d).toFixed(0)+"px"); e.style.background=cs[k%5]; b.appendChild(e); } host.appendChild(b); setTimeout(()=>b.remove(),900); }
  function say(t){ try{ const u=new SpeechSynthesisUtterance(t); const v=speechSynthesis.getVoices().find(x=>x.lang==="en-AU"); if(v) u.voice=v; u.lang="en-AU"; u.rate=.8; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  const cur=()=>B.list[B.i];
  const canHiss=a=>/(s|z|f|v|m|n|l|r|h|sh|th|w|y)$/i.test(String(a||"").trim());
  function stageHTML(){ const {it,bk}=cur(), P=parts(it), f=bForms(it).map(x=>GSDISP[String(x).toLowerCase()]||x);
    if(B.mode==="slide") return `<div class="brp-stage" id="brpStage">
        <div class="brp-piece a" id="brpA" style="left:${B.x}%">${P.pa?`<span class="brp-pic">${P.pa}</span>`:""}<b>${E(P.A)}</b></div>
        <div class="brp-piece b" id="brpB">${P.pb?`<span class="brp-pic">${P.pb}</span>`:""}<b>${E(P.B)}</b></div>
        <div class="brp-res" id="brpRes" ${B.done?"":"hidden"}>${P.pw?`<span class="brp-pic big">${P.pw}</span>`:""}<b>${E(P.W)}</b></div>
        <div class="brp-say" id="brpSay">${B.done?"":E(P.A)+" + "+E(P.B)}</div></div>
      <div class="brp-steps">${f.map((x,i)=>`<button data-brp="auto" data-v="${i}">${E(x)}</button>`).join("")}</div>
      <p class="brp-tip">${B.done?"":"Slide the first part across to join it up."}</p>`;
    if(B.mode==="hiss") return `<div class="brp-stage" id="brpStage">
        <div class="brp-snake" id="brpSnake"></div><div class="brp-hlab" id="brpHlab">${E(P.A)}</div>
        <div class="brp-piece b dim" id="brpB" style="left:76%">${P.pb?`<span class="brp-pic">${P.pb}</span>`:""}<b>${E(P.B)}</b></div>
        <div class="brp-res" id="brpRes" ${B.done?"":"hidden"}>${P.pw?`<span class="brp-pic big">${P.pw}</span>`:""}<b>${E(P.W)}</b></div>
        <div class="brp-say" id="brpSay">${B.done?"":canHiss(P.A)?"Hold the button and keep the sound going…":"Hold it… then let go into the next word"}</div></div>
      <button class="brp-hold" id="brpHold" ${B.done?"disabled":""}>${canHiss(P.A)?`Hold me: ${E(P.A)}${E(P.A).slice(-1).repeat(3)}…`:`Hold me: ${E(P.A)}… then let go`}</button>`;
    return `<div class="brp-stage river" id="brpStage">
        <div class="brp-frog" id="brpFrog" style="left:${[4,22,48,74][B.step+1]}%">🐸</div>
        <div class="brp-bank">${P.pw?`<span class="brp-pic">${B.step>=2?P.pw:(P.pb||"🏁")}</span>`:"🏁"}</div>
        <div class="brp-stones">${f.map((x,i)=>`<button class="brp-stone ${i<=B.step?"done":""}" data-brp="stone" data-v="${i}">${E(x)}</button>`).join("")}</div>
        <div class="brp-say" id="brpSay">${B.step<0?"Tap the first stone":"Say: <b>"+E(f[B.step])+"</b>"}</div></div>`;
  }
  function draw(){ const o=document.getElementById("brp"); if(!o||!B) return; const {it}=cur(), P=parts(it);
    o.innerHTML=`<div class="brp-box">
      <div class="brp-top"><b>Bridge it</b><span class="brp-seg">${[["slide","Slide it in"],["hiss","Hold the sound"],["stones","Stepping stones"]].map(([v,l])=>`<button data-brp="mode" data-v="${v}" aria-pressed="${B.mode===v}">${l}</button>`).join("")}</span>
        <span class="brp-nav"><button data-brp="prev" ${B.i?"":"disabled"} aria-label="Previous">‹</button><span>${B.i+1}/${B.list.length}</span><button data-brp="next" ${B.i<B.list.length-1?"":"disabled"} aria-label="Next">›</button></span>
        <span class="brp-goes">★ ${B.goes}</span><button class="brp-x" data-brp="close">Close</button></div>
      <div class="brp-main">${stageHTML()}</div>
      <div class="brp-foot ${B.done?"show":""}"><button data-brp="hear" class="brp-g">🔊 ${E(P.W)}</button><span style="flex:1"></span><button data-brp="again" class="brp-g">↻ Again</button><button data-brp="said" class="brp-ok">✓ Said it</button></div>
    </div>`;
    bind(); }
  function finish(){ if(B.done) return; B.done=true; const st=document.getElementById("brpStage"); const res=document.getElementById("brpRes");
    ["brpA","brpB","brpSnake","brpHlab"].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add("gone"); });
    if(res){ res.hidden=false; res.classList.add("pop"); } const s=document.getElementById("brpSay"); if(s) s.textContent="";
    if(st) boom(st, st.clientWidth*.5, st.clientHeight*.4);
    const f=document.querySelector("#brp .brp-foot"); if(f) f.classList.add("show"); }
  function setX(x){ const P=parts(cur().it); B.x=Math.max(2,Math.min(56,x)); const a=document.getElementById("brpA"); if(a) a.style.left=B.x+"%"; const g=56-B.x;
    const s=document.getElementById("brpSay"); if(s && !B.done) s.innerHTML = g>28?`${E(P.A)} + ${E(P.B)}`:g>5?`${E(P.A)}${"‑".repeat(Math.max(1,Math.round(g/7)))}${E(P.B)}`:`<b>${E(P.W)}</b>`;
    if(g<=5) finish(); }
  function bind(){
    const o=document.getElementById("brp");
    o.querySelectorAll("[data-brp]").forEach(b=>b.onclick=()=>act(b.dataset.brp,b.dataset.v,b));
    const a=document.getElementById("brpA");
    if(a && B.mode==="slide" && !B.done){ let drag=false, off=0;
      a.onpointerdown=e=>{ drag=true; a.setPointerCapture(e.pointerId); const r=a.getBoundingClientRect(); off=e.clientX-r.left; a.classList.add("drag"); };
      a.onpointermove=e=>{ if(!drag) return; const st=document.getElementById("brpStage").getBoundingClientRect(); setX((e.clientX-off-st.left)/st.width*100); };
      a.onpointerup=a.onpointercancel=()=>{ drag=false; a.classList.remove("drag"); }; }
    const h=document.getElementById("brpHold");
    if(h && !B.done){ let t=null, w=0; const sn=document.getElementById("brpSnake"), lab=document.getElementById("brpHlab"), P=parts(cur().it), ch=String(P.A).slice(-1);
      const start=e=>{ e.preventDefault(); clearInterval(t); w=0; t=setInterval(()=>{ w=Math.min(w+3,100); sn.style.width=(8+w*.6)+"%"; lab.textContent=canHiss(P.A)?P.A+ch.repeat(Math.round(w/10)):P.A+" "+"·".repeat(Math.round(w/12)); h.classList.add("on"); },60); };
      const end=()=>{ if(!t) return; clearInterval(t); t=null; h.classList.remove("on"); const s=document.getElementById("brpSay");
        if(w<25){ if(s) s.textContent="Hold a bit longer!"; sn.style.width="8%"; lab.textContent=P.A; return; }
        const b=document.getElementById("brpB"); if(b){ b.classList.remove("dim"); b.style.left=(8+w*.6+2)+"%"; }
        setTimeout(finish,380); };
      h.addEventListener("pointerdown",start); h.addEventListener("pointerup",end); h.addEventListener("pointerleave",end); h.addEventListener("pointercancel",end); }
  }
  function reset(){ B.done=false; B.step=-1; B.x=4; }
  function act(a,v,el){
    if(a==="close"){ close(); return; }
    if(a==="mode"){ B.mode=v; lastMode=v; reset(); draw(); return; }
    if(a==="prev"){ B.i=Math.max(0,B.i-1); reset(); draw(); return; }
    if(a==="next"){ B.i=Math.min(B.list.length-1,B.i+1); reset(); draw(); return; }
    if(a==="again"){ reset(); draw(); return; }
    if(a==="hear"){ say(parts(cur().it).W); return; }
    if(a==="said"){ const {bk,it}=cur(); const f=bForms(it); let stp=0; try{ const c=window.cur&&window.cur(); stp=(c&&c.bridge&&c.bridge[bk])||0; }catch(e){}
      try{ recTrial(true, f[stp]); }catch(e){} B.goes++; reset();
      if(B.i<B.list.length-1) B.i++; draw(); try{ toast("Added to the tally"); }catch(e){} return; }
    if(a==="auto"){ const i=+v; const ap=document.getElementById("brpA"); if(ap){ ap.style.transition="left .5s"; setTimeout(()=>{ if(ap) ap.style.transition=""; },520); } setX(i===0?4:i===1?44:57); return; }
    if(a==="stone"){ const i=+v; if(i!==B.step+1) return; B.step=i; draw(); if(i===2) setTimeout(()=>{ B.done=false; finish(); },420); return; }
  }
  function close(){ const o=document.getElementById("brp"); if(o) o.remove(); B=null; document.documentElement.style.overflow=""; try{ render(); }catch(e){} }
  window.brOpen=function(k,bk){ const o0=GS[k]; if(!o0) return; const gf=(S.ui&&S.ui.gsGrp)||"";
    const list=(o0.br||[]).filter(it=>(!gf || ((it.F||it.R||it.S||it.C||it.L)?it.g:it[5])===gf)).map(it=>({it,bk:bKey(k,it)}));
    if(!list.length){ try{ toast("No bridge words for this sound yet."); }catch(e){} return; }
    let i=Math.max(0,list.findIndex(x=>x.bk===bk));
    B={list,i,mode:lastMode,goes:0,k}; reset();
    let o=document.getElementById("brp"); if(!o){ o=document.createElement("div"); o.id="brp"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true"); o.setAttribute("aria-label","Bridge it practice"); document.body.appendChild(o); }
    document.documentElement.style.overflow="hidden"; draw(); };
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && document.getElementById("brp")) close(); });
})();

</script>
</body></html>
